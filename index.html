        }

        .facility-card:hover {
            transform: translateY(-5px);
            border-color: #27ae60;
        }

            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .facility-card h3 {
            font-size: 1.1rem;
            color: #f5f6fa;
        }
